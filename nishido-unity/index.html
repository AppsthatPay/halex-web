<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Nishido | HALEX GAMES</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #unity-container {
        position: fixed !important;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: none !important;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #unity-loading-bar {
        position: fixed;
        inset: 0;
        transform: none !important;
        background: #000;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.7s ease;
      }
      #halex-brand {
        color: #f5c542;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(15px, 5.5vw, 22px);
        font-weight: 700;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        text-shadow: 0 0 18px rgba(245, 197, 66, 0.55);
        margin-bottom: 10px;
        text-align: center;
      }
      #halex-sub {
        color: #8a8a8a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        margin-bottom: 46px;
        text-align: center;
      }
      #halex-letters {
        display: flex;
        gap: 0.32em;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(42px, 14vw, 68px);
        font-weight: 700;
        line-height: 1;
      }
      #halex-letters span {
        color: #2e2e2e;
        opacity: 0.15;
        transition: opacity 1s ease, color 1s ease, text-shadow 1s ease;
      }
      #halex-letters span.lit {
        color: #f5c542;
        opacity: 1;
        text-shadow: 0 0 14px rgba(245, 197, 66, 0.85), 0 0 34px rgba(245, 197, 66, 0.45);
      }
      #halex-letters.complete span {
        animation: halexGlow 1.1s ease-in-out infinite alternate;
      }
      @keyframes halexGlow {
        from { text-shadow: 0 0 14px rgba(245, 197, 66, 0.85), 0 0 34px rgba(245, 197, 66, 0.45); }
        to   { text-shadow: 0 0 22px rgba(245, 197, 66, 1), 0 0 58px rgba(245, 197, 66, 0.8), 0 0 90px rgba(245, 197, 66, 0.5); }
      }
      #halex-status {
        margin-top: 40px;
        color: #6f6f6f;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        letter-spacing: 0.45em;
        text-indent: 0.45em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="halex-brand">HALEX GAMES</div>
        <div id="halex-sub">ON UNITY</div>
        <div id="halex-letters"><span>H</span><span>A</span><span>L</span><span>E</span><span>X</span></div>
        <div id="halex-status">LOADING</div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Nishido</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/index.html.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/index.html.data.unityweb",
        frameworkUrl: buildUrl + "/index.html.framework.js.unityweb",
        codeUrl: buildUrl + "/index.html.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HALEX",
        productName: "Nishido",
        productVersion: "0.2.0-production",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      // HALEX letter load bar: H, then A, then L, then E, then X fade in
      // one by one and glow as real load progress advances. A steady
      // cadence keeps the sequence visible even on a fast connection.
      // When all five letters are lit, the whole word HALEX glows, holds
      // for a beat, and the loader fades away to reveal the game.
      var halexLetters = document.querySelectorAll("#halex-letters span");
      var halexTarget = 0;   // letters earned by real progress (0..5)
      var halexShown = 0;    // letters actually lit so far
      var halexReady = false;
      var halexDone = false;
      var halexTimer = setInterval(function() {
        if (halexShown < halexTarget) {
          halexLetters[halexShown].classList.add("lit");
          halexShown++;
        }
        if (halexReady && halexShown >= 5 && !halexDone) {
          halexDone = true;
          clearInterval(halexTimer);
          document.querySelector("#halex-letters").classList.add("complete");
          document.querySelector("#halex-status").textContent = "";
          setTimeout(function() {
            var bar = document.querySelector("#unity-loading-bar");
            bar.style.opacity = "0";
            setTimeout(function() { bar.style.display = "none"; }, 750);
          }, 900);
        }
      }, 460);

      document.querySelector("#unity-loading-bar").style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          halexTarget = Math.max(halexTarget, Math.min(5, Math.ceil(progress * 5)));
              }).then((unityInstance) => {
                halexTarget = 5;
                halexReady = true;
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
